name: Swell
options:
  bundleIdPrefix: com.jijilabsdigital
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  SwellCore: { path: ../SwellCore }
  SwellSignal: { path: ../SwellSignal }
  Tor: { path: ../TorDynamic }
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: BP5Y88466Q
    CODE_SIGN_STYLE: Automatic
targets:
  Swell:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - { package: SwellCore }
      - { package: SwellSignal }
      - { package: Tor, product: CTor, embed: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jijilabsdigital.swell
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # libsignal_ffi prebuilt (ios/SwellSignal/scripts/setup-libsignal.sh); device only, no Simulator slices are used.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../vendor/libsignal/target/aarch64-apple-ios-sim/release
    entitlements:
      path: Sources/Swell.entitlements
      properties:
        com.apple.developer.associated-domains: ["applinks:jijilabsdigital.com"]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Swell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Swell uses the camera to scan a Swell code or a safety-number code, or to take a photo you choose to send.
        NSMicrophoneUsageDescription: Swell uses the microphone only while you record a voice note.
        NSPhotoLibraryUsageDescription: Swell reads a photo only when you choose it as your profile photo.
