# Swell demo contact (echo bot) for Play/App Store reviewers. Onion service only, no published ports.
name: swell-demobot
services:
  demobot:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    cpus: 0.3
    mem_limit: 220m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
