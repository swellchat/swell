# Swell mailbox — onion service only, no published ports. Separate project;
name: swell-mailbox
services:
  mailbox:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    # No CPU or memory cap (owner, 2026-11-04): the mailbox may use what the VPS has.
    pids_limit: 1024 # virtual threads: only a few carrier threads, however many waiters
    ulimits:
      nofile: { soft: 16384, hard: 16384 } # one socket per parked WAIT (default caps: 6000 connections, 4000 waiters)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/tor/hs/hostname && kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }
