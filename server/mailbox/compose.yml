# Swell mailbox — onion service only, no published ports. Separate project;
name: swell-mailbox
services:
  mailbox:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/tor/hs/hostname && kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }
