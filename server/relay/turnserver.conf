# Swell relay — see docs/CALLS.md. Media is DTLS-SRTP end-to-end; the relay only forwards ciphertext.
listening-port=3478
external-ip=203.0.113.10
min-port=40000
max-port=40199
realm=swell
use-auth-secret
fingerprint
no-tcp-relay
no-tls
no-dtls
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600
user-quota=4
total-quota=200
# bytes per second per session (Opus voice needs about 4 KB/s)
max-bps=24000
# Never relay into private, loopback or link-local networks (no pivot into the VPS or its LAN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Privacy: no log file, no stdout log (compose also sets logging: none).
no-stdout-log
log-file=/dev/null
